server:
  port: 9092
  ssl:
    enabled: false
  forward-headers-strategy: native

spring:
  datasource:
    url: jdbc:mysql://projects-mysql:3306/edudy?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQL8Dialect

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

attendance:
  auto-mark-absent:
    enabled: true
    hour: 2
    minute: 0
    exclude-weekends: true
    exclude-holidays: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

sms:
  solapi:
    api-key: ${SMS_API_KEY:}
    api-secret: ${SMS_API_SECRET:}
    sender: ${SMS_SENDER:01000000000}

holiday:
  api:
    service-key: ${HOLIDAY_API_KEY:}
